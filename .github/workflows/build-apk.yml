name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners already ship with the Android SDK (ANDROID_HOME is set).
      # We only need to accept the licenses so Gradle can download any missing packages.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore (optional)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/grabix.jks"
          echo "GRABIX_KEYSTORE=$RUNNER_TEMP/grabix.jks" >> "$GITHUB_ENV"

      - name: Build release APKs
        env:
          GRABIX_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GRABIX_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GRABIX_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: List APKs
        run: ls -lh app/build/outputs/apk/release/

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: grabix-apks
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
